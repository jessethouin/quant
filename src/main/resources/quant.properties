# TICKER, TRADE, ORDER_BOOK, KLINE, BAR, QUOTE
dataFeed = BAR

# for securities, use comma separated stock symbols with no spaces, e.g. AAPL,GOOG,MSFT
securities = AAPL
# for fiatCurrencies, use comma separated fiatCurrencies with no spaces, e.g. USD,CAD. USD is required.
fiatCurrencies = USD
# for cryptocurrencies, use comma separated cryptocurrencies with no spaces, e.g. BTC,USDT,ETH
cryptoCurrencies = BTC
# ALPACA, ALPACA_SECURITY_TEST, ALPACA_CRYPTO_TEST, COINBASE, CEXIO, BINANCE, BINANCE_TEST, see com.jessethouin.quant.conf.Broker
broker = ALPACA